version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-claper}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DB=${POSTGRES_DB:-claper}
    volumes:
      - claper-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${POSTGRES_DB:-claper}", "-U", "${POSTGRES_USER:-claper}"]
      retries: 3
      timeout: 5s
    networks:
      - claper-net

  app:
    image: ghcr.io/claperco/claper:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - claper-uploads:/app/uploads

    environment:
      # --- core app config ---
      - SERVICE_FQDN_APP=claper.automate.business.aau.dk
      - SERVICE_URL_APP=https://claper.automate.business.aau.dk
      - BASE_URL=https://claper.automate.business.aau.dk
      - CLAPER_DOMAIN=claper.automate.business.aau.dk

      # --- db config ---
      - POSTGRES_USER=${POSTGRES_USER:-claper}
      - POSTGRES_DB=${POSTGRES_DB:-claper}
      - DATABASE_URL=${DATABASE_URL:?}
      # example for Coolify env:
      # DATABASE_URL=postgres://claper:${POSTGRES_PASSWORD}@db:5432/claper

      # --- mail config ---
      - MAIL_FROM=${MAIL_FROM:-noreply@claper.co}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Claper}
      - MAIL_TRANSPORT=${MAIL_TRANSPORT:-local}

      # --- file storage ---
      - PRESENTATION_STORAGE=${PRESENTATION_STORAGE:-local}
      - PRESENTATION_STORAGE_DIR=${PRESENTATION_STORAGE_DIR:-/app/uploads}

      # --- secret key (required) ---
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:?}

    healthcheck:
      test: "curl --fail http://localhost:4000 || exit 1"
      retries: 3
      start_period: 20s
      timeout: 5s

    # no ports exposed; Coolify's Traefik will publish it
    labels:
      - traefik.enable=true

      # Router: traffic for this domain goes to this service
      - traefik.http.routers.claper.rule=Host(`claper.automate.business.aau.dk`) && PathPrefix(`/`)
      - traefik.http.routers.claper.entryPoints=https
      - traefik.http.routers.claper.tls=true
      - traefik.http.routers.claper.tls.certresolver=letsencrypt

      # Service: Traefik must talk to internal port 4000
      - traefik.http.services.claper.loadbalancer.server.port=4000

    networks:
      - claper-net

volumes:
  claper-db:
    driver: local
  claper-uploads:
    driver: local

networks:
  claper-net:
    driver: bridge