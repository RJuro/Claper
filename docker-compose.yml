version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-claper}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DB=${POSTGRES_DB:-claper}
    volumes:
      - claper-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${POSTGRES_DB:-claper}", "-U", "${POSTGRES_USER:-claper}"]
      retries: 3
      timeout: 5s
    networks:
      - claper-net

  app:
    image: ghcr.io/claperco/claper:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - claper-uploads:/app/uploads

    environment:
      # ---- core runtime config ----
      - CLAPER_DOMAIN=${CLAPER_DOMAIN:?}

      - SERVICE_FQDN_APP=${CLAPER_DOMAIN:?}
      - SERVICE_URL_APP=https://${CLAPER_DOMAIN:?}

      # if Claper internally builds absolute URLs, BASE_URL should be the public URL.
      # The sample you gave includes :4000, but behind Coolify/Traefik you do NOT expose 4000 publicly.
      # So we point BASE_URL to normal https on your domain (no :4000).
      - BASE_URL=https://${CLAPER_DOMAIN:?}

      # database
      - POSTGRES_USER=${POSTGRES_USER:-claper}
      - POSTGRES_DB=${POSTGRES_DB:-claper}
      - DATABASE_URL=${DATABASE_URL:?}

      # mail
      - MAIL_FROM=${MAIL_FROM:-noreply@claper.co}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Claper}
      - MAIL_TRANSPORT=${MAIL_TRANSPORT:-local}

      # uploads / presentations
      - PRESENTATION_STORAGE=${PRESENTATION_STORAGE:-local}
      - PRESENTATION_STORAGE_DIR=${PRESENTATION_STORAGE_DIR:-/app/uploads}

      # secret for signing/encryption
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:?}

    healthcheck:
      test: "curl --fail http://localhost:4000 || exit 1"
      retries: 3
      start_period: 20s
      timeout: 5s

    # do NOT expose ports; Coolify's Traefik will handle HTTPS
    labels:
      - traefik.enable=true

      # Router: send traffic for this domain to this service
      - traefik.http.routers.claper.rule=Host(`${CLAPER_DOMAIN:?}`) && PathPrefix(`/`)
      - traefik.http.routers.claper.entryPoints=https
      - traefik.http.routers.claper.tls=true
      - traefik.http.routers.claper.tls.certresolver=letsencrypt

      # Service: tell Traefik to talk to container port 4000 internally
      - traefik.http.services.claper.loadbalancer.server.port=4000

    networks:
      - claper-net

volumes:
  claper-db:
    driver: local
  claper-uploads:
    driver: local

networks:
  claper-net:
    driver: bridge
